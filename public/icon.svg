<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Claymorphic Rounded Icon Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#clayGrad)" filter="url(#softShadow)"/>
  
  <!-- Subtle Inset Gloss Highlight -->
  <rect x="36" y="36" width="440" height="440" rx="108" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6"/>

  <!-- Academic Graduation Cap Symbol -->
  <g transform="translate(96, 110) scale(13.33)" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Mortarboard Top -->
    <polygon points="12 2 22 7 12 12 2 7 12 2" fill="#FFFFFF" fill-opacity="0.2"/>
    <path d="M22 7v6"/>
    <!-- Cap Base -->
    <path d="M6 9.5v5c3 3 9 3 12 0v-5"/>
    <!-- Tassel -->
    <path d="M22 13a1 1 0 1 1-2 0 1 1 0 0 1 2 0z" fill="#FFFFFF"/>
  </g>
</svg>
