<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Zero-Flash Theme Initialization Script (Executes synchronously before DOM paint) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('abes_theme');
          var isDark = saved ? (saved === 'dark') : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#000000';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#EEF3F8';
          }
          // Dynamic PWA status bar sync
          var appleStatus = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (appleStatus) appleStatus.setAttribute('content', isDark ? 'black-translucent' : 'default');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEF3F8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />

    <!-- Google tag (gtag.js) -->

      gtag('js', new Date());

      gtag('config', 'G-D148LWSM0J');
    </script>
