name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci || npm install

      - name: Build Web Assets for Mobile
        run: |
          cd mobile
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd mobile
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: |
          cd mobile/android
          chmod +x gradlew

      - name: Build Android Release APK
        run: |
          cd mobile/android
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Locate and Rename APK
        run: |
          mkdir -p mobile-builds
          APK_PATH=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" mobile-builds/abes-portal.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: abes-portal-apk
          path: mobile-builds/abes-portal.apk

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-builds/abes-portal.apk
          name: ABES Portal Mobile ${{ github.ref_name }}
          body: |
            ## 📱 ABES Portal Android Release (${{ github.ref_name }})
            
            ### What's New
            - Direct connection to ABES ERP with 0 Cloudflare Worker latency
            - 1-Tap Fast Login with saved credentials
            - Real-time attendance percentage & bunk calculator
            - Date-wise lecture timeline & fee receipts
            
            ### Installation
            1. Download `abes-portal.apk` below.
            2. Open the downloaded file on your Android device.
            3. Allow "Install from unknown sources" if prompted.
          draft: false
          prerelease: false
