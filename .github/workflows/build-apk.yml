name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci || npm install

      - name: Build Web Assets for Mobile
        run: |
          cd mobile
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd mobile
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: |
          cd mobile/android
          chmod +x gradlew

      - name: Build Android APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug

      - name: Locate and Rename APK
        run: |
          mkdir -p mobile-builds
          APK_PATH=$(find mobile/android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" mobile-builds/abes-portal.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: abes-portal-apk
          path: mobile-builds/abes-portal.apk

      - name: Generate Release Body from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Extracting release notes for: $VERSION"
          python3 -c "
          import re, os
          tag = os.environ.get('GITHUB_REF_NAME', '').lstrip('v')
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = rf'## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              notes = match.group(1).strip() if match else 'Performance improvements and bug fixes.'
              notes = re.sub(r'\n---\s*$', '', notes).strip()
          except Exception:
              notes = 'Performance improvements and bug fixes.'

          body = f'''## 📱 ABES Portal Android Release (v{tag})

          ### 🚀 What\'s New in v{tag}:
          {notes}

          ### 📥 Installation Instructions:
          1. Download **\`abes-portal.apk\`** from Assets below.
          2. Tap **Install** (or update over existing installation).
          3. Enjoy seamless ERP access without repetitive OTP requests!
          '''
          with open('release_body.md', 'w', encoding='utf-8') as out:
              out.write(body.strip() + '\n')
          "

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-builds/abes-portal.apk
          name: ABES Portal Mobile ${{ github.ref_name }}
          body_path: release_body.md
          draft: false
          prerelease: false
