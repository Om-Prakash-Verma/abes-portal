name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci || npm install

      - name: Build Web Assets for Mobile
        run: |
          cd mobile
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd mobile
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: |
          cd mobile/android
          chmod +x gradlew

      - name: Build Android APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug

      - name: Locate and Rename APK
        run: |
          mkdir -p mobile-builds
          APK_PATH=$(find mobile/android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" mobile-builds/abes-portal.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: abes-portal-apk
          path: mobile-builds/abes-portal.apk

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-builds/abes-portal.apk
          name: ABES Portal Mobile ${{ github.ref_name }}
          body: |
            ## 📱 ABES Portal Android Release (${{ github.ref_name }})
            
            ### 🚀 What's New in ${{ github.ref_name }}:
            - **Native Background Session Keep-Alive**: Runs an Android Foreground Service that pings `KeepSessionAlive.aspx` every 10 minutes to prevent the 20-minute Microsoft IIS timeout even when the app is closed.
            - **Auto-Renewing Session Countdown**: Automatically extends your active login session when resuming the app or when the timer drops below 3 minutes.
            - **Zero Worker Overhead**: 100% direct native phone-to-ERP communication via `CapacitorCookies` and direct native networking with 0 Cloudflare Worker costs.
            - **Permanent Signature Keystore**: Updates install seamlessly over existing installations without package conflict errors.
            - **Status Bar & Notch Safe Area**: Header cleanly avoids physical notch, punch-holes, and battery indicators.
            - **In-App Auto-Updater**: Instant update prompts and manual checks right inside the mobile app.
            - **OLED Dark Mode Optimization**: Pitch-black `#000000` battery saver design with high-contrast claymorphic cards.
            
            ### 📥 Installation Instructions:
            1. Download **`abes-portal.apk`** from Assets below.
            2. Tap **Install** (or update).
            3. Enjoy continuous login without repetitive OTP requests!
          draft: false
          prerelease: false
